name: Build and deploy

# Renders content/landing.json into template.html → _site/, verifies the
# output, and publishes to GitHub Pages. Every CMS save is a commit to main,
# so every edit deploys itself.
#
# Requires Pages to be configured with Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest content wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # MyWell's public page is now OurWater (ourwater.org.au). This site
      # publishes only forward.html, as both the index and the 404 page, so
      # every mywell.au address (a station QR's /s/?id=… included) forwards to
      # the same path there. The site sources stay in the repo, unbuilt; to
      # bring the MyWell page back, revert this step to build.mjs + verify.mjs.
      - name: Build the forwarding site
        run: |
          mkdir -p _site
          cp forward.html _site/index.html
          cp forward.html _site/404.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
